[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-memory-mcp"
version = "1.0.0"
description = "Local vector + graph memory MCP server based on LanceDB and Kuzu"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastmcp>=2.2.0",
    "lancedb>=0.21.0",
    "kuzu>=0.10.0",
    "sentence-transformers>=3.4.0",
    "pydantic>=2.10.0",
    "python-dateutil>=2.9.0",
    "numpy>=1.26.0",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
